name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC shared, cc: gcc, cxx: g++, mode: shared, man: enabled}
          - {name: GCC static, cc: gcc, cxx: g++, mode: static, man: disabled}
          - {name: Clang shared, cc: clang, cxx: clang++, mode: shared, man: disabled}
          - {name: Clang static, cc: clang, cxx: clang++, mode: static, man: disabled}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out libpkgreconcile-apply-posix
        uses: actions/checkout@v4
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgsource, ref: v4.1.0, path: dependencies/libpkgsource}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgstate, ref: v3.1.0, path: dependencies/libpkgstate}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgimage, ref: v0.4.1, path: dependencies/libpkgimage}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgcatalog, ref: v4.0.0, path: dependencies/libpkgcatalog}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgresolve, ref: v4.0.0, path: dependencies/libpkgresolve}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild, ref: v3.0.1, path: dependencies/libpkgbuild}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgplan, ref: v0.3.1, path: dependencies/libpkgplan}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild-image, ref: v1.0.1, path: dependencies/libpkgbuild-image}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgsource-plan, ref: v2.0.0, path: dependencies/libpkgsource-plan}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild-plan, ref: v1.1.0, path: dependencies/libpkgbuild-plan}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgapply, ref: v3.0.1, path: dependencies/libpkgapply}}
      - name: Check out libpkgreconcile 0.3.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgreconcile
          ref: v0.3.0
          path: dependencies/libpkgreconcile
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgapply-posix, ref: v3.2.1, path: dependencies/libpkgapply-posix}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgreconcile-apply, ref: v0.1.1, path: dependencies/libpkgreconcile-apply}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgreconcile-posix, ref: v0.1.0, path: dependencies/libpkgreconcile-posix}}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils clang doxygen libacl1-dev libarchive-dev libbz2-dev liblz4-dev \
            liblzma-dev libssl-dev libxml2-dev libzstd-dev mandoc ninja-build \
            pkg-config python3-venv scdoc zlib1g-dev
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: Configure, build, and test
        env:
          LIBPKGSOURCE_SOURCE: dependencies/libpkgsource
          LIBPKGSTATE_SOURCE: dependencies/libpkgstate
          LIBPKGIMAGE_SOURCE: dependencies/libpkgimage
          LIBPKGCATALOG_SOURCE: dependencies/libpkgcatalog
          LIBPKGRESOLVE_SOURCE: dependencies/libpkgresolve
          LIBPKGBUILD_SOURCE: dependencies/libpkgbuild
          LIBPKGPLAN_SOURCE: dependencies/libpkgplan
          LIBPKGBUILD_IMAGE_SOURCE: dependencies/libpkgbuild-image
          LIBPKGSOURCE_PLAN_SOURCE: dependencies/libpkgsource-plan
          LIBPKGBUILD_PLAN_SOURCE: dependencies/libpkgbuild-plan
          LIBPKGAPPLY_SOURCE: dependencies/libpkgapply
          LIBPKGRECONCILE_SOURCE: dependencies/libpkgreconcile
          LIBPKGAPPLY_POSIX_SOURCE: dependencies/libpkgapply-posix
          LIBPKGRECONCILE_APPLY_SOURCE: dependencies/libpkgreconcile-apply
          LIBPKGRECONCILE_POSIX_SOURCE: dependencies/libpkgreconcile-posix
        run: ./ci/configure-and-test.sh build "${{ matrix.mode }}" -Dman_pages="${{ matrix.man }}"
      - name: Qualify installed consumer
        run: ./ci/qualify-installed.sh build "${{ matrix.mode }}"
      - name: Qualify public API documentation
        if: matrix.name == 'GCC shared'
        run: doxygen Doxyfile

  sanitizers:
    name: ${{ matrix.name }} address,undefined
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC, cc: gcc, cxx: g++}
          - {name: Clang, cc: clang, cxx: clang++}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - name: Check out libpkgreconcile-apply-posix
        uses: actions/checkout@v4
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgsource, ref: v4.1.0, path: dependencies/libpkgsource}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgstate, ref: v3.1.0, path: dependencies/libpkgstate}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgimage, ref: v0.4.1, path: dependencies/libpkgimage}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgcatalog, ref: v4.0.0, path: dependencies/libpkgcatalog}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgresolve, ref: v4.0.0, path: dependencies/libpkgresolve}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild, ref: v3.0.1, path: dependencies/libpkgbuild}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgplan, ref: v0.3.1, path: dependencies/libpkgplan}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild-image, ref: v1.0.1, path: dependencies/libpkgbuild-image}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgsource-plan, ref: v2.0.0, path: dependencies/libpkgsource-plan}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgbuild-plan, ref: v1.1.0, path: dependencies/libpkgbuild-plan}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgapply, ref: v3.0.1, path: dependencies/libpkgapply}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgreconcile, ref: v0.3.0, path: dependencies/libpkgreconcile}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgapply-posix, ref: v3.2.1, path: dependencies/libpkgapply-posix}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgreconcile-apply, ref: v0.1.1, path: dependencies/libpkgreconcile-apply}}
      - {uses: actions/checkout@v4, with: {repository: zeppe-lin/libpkgreconcile-posix, ref: v0.1.0, path: dependencies/libpkgreconcile-posix}}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils clang libacl1-dev libarchive-dev libbz2-dev liblz4-dev \
            liblzma-dev libssl-dev libxml2-dev libzstd-dev ninja-build \
            pkg-config python3-venv zlib1g-dev
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: Configure, build, and test sanitized closure
        env:
          LIBPKGSOURCE_SOURCE: dependencies/libpkgsource
          LIBPKGSTATE_SOURCE: dependencies/libpkgstate
          LIBPKGIMAGE_SOURCE: dependencies/libpkgimage
          LIBPKGCATALOG_SOURCE: dependencies/libpkgcatalog
          LIBPKGRESOLVE_SOURCE: dependencies/libpkgresolve
          LIBPKGBUILD_SOURCE: dependencies/libpkgbuild
          LIBPKGPLAN_SOURCE: dependencies/libpkgplan
          LIBPKGBUILD_IMAGE_SOURCE: dependencies/libpkgbuild-image
          LIBPKGSOURCE_PLAN_SOURCE: dependencies/libpkgsource-plan
          LIBPKGBUILD_PLAN_SOURCE: dependencies/libpkgbuild-plan
          LIBPKGAPPLY_SOURCE: dependencies/libpkgapply
          LIBPKGRECONCILE_SOURCE: dependencies/libpkgreconcile
          LIBPKGAPPLY_POSIX_SOURCE: dependencies/libpkgapply-posix
          LIBPKGRECONCILE_APPLY_SOURCE: dependencies/libpkgreconcile-apply
          LIBPKGRECONCILE_POSIX_SOURCE: dependencies/libpkgreconcile-posix
          MESON_SANITIZE: address,undefined
        run: ./ci/configure-and-test.sh build-sanitize shared -Db_sanitize=address,undefined -Db_lundef=false -Dman_pages=disabled
